<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Union Search 已接入的 50 个搜索渠道</title>
  <desc id="desc">按访问方式分为三组：25 个无需 API Key 的渠道、22 个 API 服务商和 3 个本机 AI 工具。API 组末尾保留一个虚线席位，表示欢迎新的搜索服务入驻。Reddit 与火山引擎标记为受限。</desc>
  <rect width="1200" height="960" rx="22" fill="#0c1425"/>

  <g font-family="Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
    <text x="48" y="78" fill="#f1f5fb" font-size="40" font-weight="700">已接入的搜索渠道</text>
    <text x="1152" y="78" text-anchor="end" fill="#9fb1c9" font-size="20">50 个搜索渠道 · 16 个图片平台 · 1 个正文提取</text>

    <g id="general">
      <rect x="48" y="112" width="8" height="26" rx="4" fill="#86edc5"/>
      <text x="68" y="134" fill="#86edc5" font-size="24" font-weight="700">25</text>
      <text x="104" y="134" fill="#e6f1fb" font-size="22" font-weight="600">无需 API Key</text>
      <text x="252" y="134" fill="#8c9fb9" font-size="18">默认分组 general，开箱即用</text>
      <g fill="#12283a" stroke="#3f7f6f">
        <rect x="48" y="152" width="208" height="44" rx="10"/><rect x="272" y="152" width="208" height="44" rx="10"/><rect x="496" y="152" width="208" height="44" rx="10"/><rect x="720" y="152" width="208" height="44" rx="10"/><rect x="944" y="152" width="208" height="44" rx="10"/>
        <rect x="48" y="208" width="208" height="44" rx="10"/><rect x="272" y="208" width="208" height="44" rx="10"/><rect x="496" y="208" width="208" height="44" rx="10"/><rect x="720" y="208" width="208" height="44" rx="10"/><rect x="944" y="208" width="208" height="44" rx="10"/>
        <rect x="48" y="264" width="208" height="44" rx="10"/><rect x="272" y="264" width="208" height="44" rx="10"/><rect x="496" y="264" width="208" height="44" rx="10"/><rect x="720" y="264" width="208" height="44" rx="10"/><rect x="944" y="264" width="208" height="44" rx="10"/>
        <rect x="48" y="320" width="208" height="44" rx="10"/><rect x="272" y="320" width="208" height="44" rx="10"/><rect x="496" y="320" width="208" height="44" rx="10"/><rect x="720" y="320" width="208" height="44" rx="10"/><rect x="944" y="320" width="208" height="44" rx="10"/>
        <rect x="48" y="376" width="208" height="44" rx="10"/><rect x="272" y="376" width="208" height="44" rx="10"/><rect x="496" y="376" width="208" height="44" rx="10"/><rect x="720" y="376" width="208" height="44" rx="10"/><rect x="944" y="376" width="208" height="44" rx="10"/>
      </g>
      <g fill="#dff7ee" font-size="19" text-anchor="middle">
        <text x="152" y="181">百度直连</text><text x="376" y="181">Bing 中国</text><text x="600" y="181">Bing 国际</text><text x="824" y="181">360 搜索</text><text x="1048" y="181">搜狗</text>
        <text x="152" y="237">今日头条</text><text x="376" y="237">集思录</text><text x="600" y="237">Google 直连</text><text x="824" y="237">Google 香港</text><text x="1048" y="237">Yahoo 直连</text>
        <text x="152" y="293">Yahoo</text><text x="376" y="293">DuckDuckGo</text><text x="600" y="293">DuckDuckGo HTML</text><text x="824" y="293">DuckDuckGo 即时答案</text><text x="1048" y="293">Brave</text>
        <text x="152" y="349">Brave 直连</text><text x="376" y="349">Startpage</text><text x="600" y="349">Ecosia</text><text x="824" y="349">Qwant</text><text x="1048" y="349">Mojeek</text>
        <text x="152" y="405">WolframAlpha</text><text x="376" y="405">Wikipedia</text><text x="600" y="405">GitHub</text><text x="824" y="405">Reddit</text><text x="1048" y="405">AnySearch</text>
      </g>
      <circle cx="738" cy="398" r="5" fill="#f28b6d"/>
    </g>

    <g id="api">
      <rect x="48" y="460" width="8" height="26" rx="4" fill="#f2c46d"/>
      <text x="68" y="482" fill="#f2c46d" font-size="24" font-weight="700">22</text>
      <text x="104" y="482" fill="#e6f1fb" font-size="22" font-weight="600">API 服务商</text>
      <text x="234" y="482" fill="#8c9fb9" font-size="18">分组 api，配置凭据后按需调用</text>
      <g fill="#2a2a24" stroke="#8a7440">
        <rect x="48" y="500" width="208" height="44" rx="10"/><rect x="272" y="500" width="208" height="44" rx="10"/><rect x="496" y="500" width="208" height="44" rx="10"/><rect x="720" y="500" width="208" height="44" rx="10"/><rect x="944" y="500" width="208" height="44" rx="10"/>
        <rect x="48" y="556" width="208" height="44" rx="10"/><rect x="272" y="556" width="208" height="44" rx="10"/><rect x="496" y="556" width="208" height="44" rx="10"/><rect x="720" y="556" width="208" height="44" rx="10"/><rect x="944" y="556" width="208" height="44" rx="10"/>
        <rect x="48" y="612" width="208" height="44" rx="10"/><rect x="272" y="612" width="208" height="44" rx="10"/><rect x="496" y="612" width="208" height="44" rx="10"/><rect x="720" y="612" width="208" height="44" rx="10"/><rect x="944" y="612" width="208" height="44" rx="10"/>
        <rect x="48" y="668" width="208" height="44" rx="10"/><rect x="272" y="668" width="208" height="44" rx="10"/><rect x="496" y="668" width="208" height="44" rx="10"/><rect x="720" y="668" width="208" height="44" rx="10"/><rect x="944" y="668" width="208" height="44" rx="10"/>
        <rect x="48" y="724" width="208" height="44" rx="10"/><rect x="272" y="724" width="208" height="44" rx="10"/>
      </g>
      <g fill="#fbeccb" font-size="19" text-anchor="middle">
        <text x="152" y="529">Tavily</text><text x="376" y="529">Exa</text><text x="600" y="529">Serper</text><text x="824" y="529">Firecrawl</text><text x="1048" y="529">Jina</text>
        <text x="152" y="585">Parallel</text><text x="376" y="585">Ollama</text><text x="600" y="585">TinyFish</text><text x="824" y="585">Google CSE</text><text x="1048" y="585">Bing · SerpAPI</text>
        <text x="152" y="641">Yandex · SerpAPI</text><text x="376" y="641">YouTube</text><text x="600" y="641">秘塔搜索</text><text x="824" y="641">小宇宙 FM</text><text x="1048" y="641">Kimi</text>
        <text x="152" y="697">智谱</text><text x="376" y="697">DeepSeek</text><text x="600" y="697">腾讯元宝</text><text x="824" y="697">阿里云百炼</text><text x="1048" y="697">百度千帆</text>
        <text x="152" y="753">火山引擎</text><text x="376" y="753">知乎开放平台</text>
      </g>
      <circle cx="74" cy="746" r="5" fill="#f28b6d"/>
      <rect x="496" y="724" width="656" height="44" rx="10" fill="none" stroke="#f2c46d" stroke-width="2" stroke-dasharray="8 7"/>
      <text x="824" y="753" text-anchor="middle" fill="#f2c46d" font-size="20" font-weight="600">＋ 你的搜索服务 · 欢迎入驻</text>
    </g>

    <g id="ai-tools">
      <rect x="48" y="808" width="8" height="26" rx="4" fill="#b9a6ff"/>
      <text x="68" y="830" fill="#b9a6ff" font-size="24" font-weight="700">3</text>
      <text x="92" y="830" fill="#e6f1fb" font-size="22" font-weight="600">本机 AI 工具</text>
      <text x="226" y="830" fill="#8c9fb9" font-size="18">分组 ai_tools，使用本机登录与账号额度</text>
      <g fill="#221f3a" stroke="#6c5fae">
        <rect x="48" y="848" width="208" height="44" rx="10"/><rect x="272" y="848" width="208" height="44" rx="10"/><rect x="496" y="848" width="208" height="44" rx="10"/>
      </g>
      <g fill="#e9e3ff" font-size="19" text-anchor="middle">
        <text x="152" y="877">Claude Code</text><text x="376" y="877">Codex</text><text x="600" y="877">Grok Build</text>
      </g>
      <circle cx="736" cy="864" r="5" fill="#f28b6d"/>
      <text x="750" y="870" fill="#9fb1c9" font-size="18">访问受限，结果不稳定</text>
    </g>

    <path d="M48 916H1152" stroke="#2f4058"/>
    <text x="48" y="942" fill="#8c9fb9" font-size="16">渠道名称与分组以 python union_search_cli.py list 的输出为准；接入不代表在所有网络和账号下都可用</text>
  </g>
</svg>
