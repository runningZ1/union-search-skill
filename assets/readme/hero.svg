<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Union Search Skill</title>
  <desc id="desc">One CLI routes a query to selected sources and returns structured results. Workflow schematic, not a screenshot or live status.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#26344c" stroke-width="0.6"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1425"/><stop offset="1" stop-color="#182840"/></linearGradient>
  </defs>
  <rect width="1200" height="460" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="20" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="40" width="246" height="28" rx="14" fill="#183d42"/>
    <text x="64" y="59" fill="#86edc5" font-size="12" letter-spacing="2">SEARCH / READ / DOWNLOAD</text>
    <text x="46" y="132" fill="#f1f5fb" font-size="60" font-weight="700" letter-spacing="-2">Union Search</text>
    <text x="50" y="172" fill="#b6c7dd" font-size="21">Selected sources. One CLI. Structured output.</text>
    <text x="50" y="211" fill="#8c9fb9" font-size="15">For terminal users, Claude Code and Codex</text>
    <rect x="48" y="249" width="544" height="134" rx="12" fill="#09111f" stroke="#34445d"/>
    <circle cx="69" cy="270" r="4" fill="#5f738f"/><circle cx="84" cy="270" r="4" fill="#5f738f"/><circle cx="99" cy="270" r="4" fill="#5f738f"/>
    <g font-family="Consolas,monospace" font-size="15">
      <text x="68" y="309" fill="#86edc5">$ python union_search_cli.py search "AI agent"</text>
      <text x="85" y="339" fill="#c9d7ea">--platforms github wikipedia</text>
      <text x="85" y="364" fill="#c9d7ea">--limit 3 --deduplicate --pretty</text>
    </g>
    <g fill="none" stroke="#527392" stroke-width="2">
      <path d="M663 153H713V93H756M713 153H756M713 153V213H756"/>
      <path d="M1000 93H1040V153H1090M1000 153H1090M1000 213H1040V153"/>
      <path d="M1090 153V284H1000" stroke="#86edc5"/>
    </g>
    <rect x="630" y="126" width="66" height="54" rx="10" fill="#214051" stroke="#68c9b0"/>
    <text x="663" y="160" text-anchor="middle" fill="#e4fff4" font-family="Consolas,monospace" font-size="19">CLI</text>
    <g fill="#15263d" stroke="#415a79">
      <rect x="756" y="69" width="244" height="48" rx="9"/>
      <rect x="756" y="129" width="244" height="48" rx="9"/>
      <rect x="756" y="189" width="244" height="48" rx="9"/>
    </g>
    <g fill="#d9e7f8" font-size="16">
      <text x="777" y="99">Developer sources</text>
      <text x="777" y="159">Web &amp; social sources</text>
      <text x="777" y="219">AI search services</text>
    </g>
    <rect x="756" y="260" width="244" height="65" rx="10" fill="#183d42" stroke="#5eb49e"/>
    <text x="777" y="287" fill="#a8f4d7" font-size="17" font-weight="600">JSON / Markdown / Text</text>
    <text x="777" y="309" fill="#b7d6d1" font-size="13">Results for people and agents</text>
    <text x="756" y="366" fill="#9fb1c9" font-size="13">Choose channels. Inspect results. Handle errors.</text>
    <path d="M48 410H1152" stroke="#34445d"/>
    <text x="50" y="438" fill="#8c9fb9" font-size="12" letter-spacing="1.5">UNION-SEARCH-SKILL</text>
    <text x="1150" y="438" text-anchor="end" fill="#8c9fb9" font-size="12">Workflow schematic · not a live status view</text>
  </g>
</svg>
