name: 搜索服务商入驻申请 / Search provider listing
description: 申请把你的搜索 API 接入 Union Search，进入 api 分组和 README 渠道墙 / Apply to add your search API to the api group and the README channel wall
title: "[入驻 / Listing] <服务名称 / Service name>"
labels: ["provider-listing"]
body:
  - type: markdown
    attributes:
      value: |
        感谢关注 Union Search。请填写下面的信息，维护者评估后会在本 Issue 中回复接入计划。请勿在 Issue 中粘贴真实 API Key；测试凭据请在回复中约定私下提供的方式。

        Thanks for your interest in Union Search. Fill in the details below; maintainers will reply with an integration plan in this issue. Do not paste real API keys here; agree on a private way to share test credentials in the replies.
  - type: input
    id: service_name
    attributes:
      label: 服务名称与官网 / Service name and website
      placeholder: Example Search · https://example.com
    validations:
      required: true
  - type: dropdown
    id: service_type
    attributes:
      label: 服务类型 / Service type
      options:
        - 网页搜索 API / Web search API
        - AI 搜索 / 联网搜索 API / AI search API
        - 垂直领域搜索 / Vertical search (academic, code, news, community)
        - 图片或多媒体搜索 / Image or media search
        - 网页正文提取 / Content extraction
        - 其他 / Other
    validations:
      required: true
  - type: input
    id: api_docs
    attributes:
      label: 公开 API 文档链接 / Public API documentation
    validations:
      required: true
  - type: textarea
    id: auth_and_quota
    attributes:
      label: 认证方式、免费额度与计费 / Authentication, free quota and pricing
      description: 环境变量建议名称、免费额度、单价、限流规则 / Suggested environment variable, free quota, unit price, rate limits
      placeholder: |
        认证 / Auth: Bearer token, EXAMPLE_API_KEY
        免费额度 / Free quota: 1,000 requests per month
        限流 / Rate limit: 10 QPS
    validations:
      required: true
  - type: textarea
    id: response_fields
    attributes:
      label: 返回字段 / Response fields
      description: 至少说明标题、链接、摘要对应的字段；有正文、发布时间、相关度等字段也请列出 / At least the title, link and snippet fields; also list content, publish time, relevance and similar fields
    validations:
      required: true
  - type: textarea
    id: example_request
    attributes:
      label: 请求示例 / Example request
      description: curl 示例或官方 SDK 用法，Key 用占位符代替 / curl or SDK usage with a placeholder key
      render: bash
  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项 / Confirmations
      options:
        - label: 服务条款允许通过 Agent 和命令行工具调用搜索接口 / The terms of service allow calls from agents and command-line tools
          required: true
        - label: 可以为验收提供测试 Key 或免费额度 / A test key or free quota can be provided for verification
          required: true
  - type: textarea
    id: cooperation
    attributes:
      label: 合作意向 / Collaboration
      description: 例如新用户专属额度、联合发布、文档互链，或希望服务商自行提交 PR / For example dedicated quota for new users, joint announcements, cross-linked docs, or a provider pull request
  - type: input
    id: contact
    attributes:
      label: 联系方式 / Contact
      description: 便于私下沟通测试凭据的邮箱或其他方式 / Email or another channel for sharing test credentials privately
